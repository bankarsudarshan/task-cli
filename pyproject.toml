[project]
name = "taskman"
version = "1.0.0"
description = "A CLI that helps you manage tasks"
authors = [
  { name="Sudarshan Bankar", email="sudarshanbankar22@gmail.com" },
  { name="Sarvesh Hase", email="sarveshhase2020@gmail.com" },
]
readme = "README.md"
requires-python = ">=3.9"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "tabulate",
    "google-api-python-client",
    "google-auth-httplib2",
    "google-auth-oauthlib",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.11.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov>=4.0"]

[project.scripts]
taskman = "taskman.cli:main"

[project.urls]
Homepage = "https://github.com/bankarsudarshan/task-cli"

[build-system]
requires = ["hatchling >= 1.26"]
build-backend = "hatchling.build"
